<div class="container">
  <button (click)="genererVoyage()">Générer un voyage</button>

  <div *ngIf="voyage" class="card">
    <h2>{{ voyage.destination }}</h2>
    <p>{{ voyage.description }}</p>
    <p>Prix : {{ voyage.prix }} €</p>
    <button (click)="validerVoyage()">Valider</button>
  </div>
</div>
